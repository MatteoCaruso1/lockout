# Codemagic cloud builds for Lockout. No Mac required.
#
# Same shape as 100 Daily Games (C:\dev\the-daily-game\codemagic.yaml): Mac mini
# M2, signing files CREATED through the "TDG App Store Key" integration, the
# same CERTIFICATE_PRIVATE_KEY secret, and releases built ON TAGS ONLY, pushed
# by `npm run ship`. What is different, and why:
#
# * Pure SwiftUI, no web build. The Xcode project is generated by XcodeGen
#   from project.yml on every build.
# * DEVELOPMENT signing, not App Store. Family Controls only works in
#   development-signed builds until Apple approves the distribution
#   entitlement (docs/FAMILY-CONTROLS-REQUEST.md). A development build installs
#   only on iPhones registered in the Apple Developer account, over USB with
#   `npm run phone:install` (see README).
# * Three bundle ids, all signed: the app and its two extensions.
# * Every push to main also gets a quick unsigned compile + unit test check
#   (`lockout-check`). Nothing is shipped from it.
#
# Tags (made by `npm run ship`):
#   ios-dev-0.1.0-b3     -> Release build, development-signed, for Matteo's iPhone
#   ios-debug-0.1.0-b3   -> Debug build (has the DEBUG emergency release button)
#   ios-beta-0.1.0-b3    -> TestFlight upload. ONLY after Apple approves Family
#                           Controls (Distribution) for all three bundle ids.

definitions:
  scripts:
    - &derive_version
      name: Work out the version from the git tag
      script: |
        set -e
        TAG="${CM_TAG:-}"
        if [ -n "$TAG" ]; then
          # ios-dev-0.1.0-b3 -> 0.1.0
          VERSION=$(echo "$TAG" | sed -E 's/^ios-[a-z]+-([0-9]+\.[0-9]+\.[0-9]+)-b[0-9]+$/\1/')
          case "$VERSION" in ios-*|"") echo "Tag $TAG is not ios-<kind>-X.Y.Z-bN"; exit 1;; esac
        else
          VERSION=0.0.0
        fi
        case "$TAG" in ios-debug-*) CONFIG=Debug;; *) CONFIG=Release;; esac
        echo "LOCKOUT_VERSION=$VERSION" >> "$CM_ENV"
        echo "LOCKOUT_BUILD=${PROJECT_BUILD_NUMBER:-1}" >> "$CM_ENV"
        echo "LOCKOUT_CONFIG=$CONFIG" >> "$CM_ENV"
        echo "Version $VERSION, build ${PROJECT_BUILD_NUMBER:-1}, configuration $CONFIG"

    - &unit_tests
      name: Unit tests (LockoutCore rules)
      script: |
        set -e
        cd LockoutCore
        swift test

    - &generate_project
      name: Generate the Xcode project (XcodeGen)
      script: |
        set -e
        brew install xcodegen >/dev/null
        xcodegen generate
        xcodebuild -list -project Lockout.xcodeproj

    - &dev_signing
      name: Create and apply development signing files (3 bundle ids)
      # Same reasoning as 100 Daily Games' &signing step: `ios_signing:` only
      # fetches files that already exist, so these commands CREATE whatever is
      # missing. IOS_APP_DEVELOPMENT profiles include every iPhone registered
      # in the Apple Developer account, so register a phone before building.
      script: |
        set -e
        keychain initialize
        for id in fun.thedailygame.lockout fun.thedailygame.lockout.monitor fun.thedailygame.lockout.shield; do
          app-store-connect fetch-signing-files "$id" \
            --type IOS_APP_DEVELOPMENT \
            --platform IOS \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
        done
        keychain add-certificates
        xcode-project use-profiles

    - &build_ipa
      name: Build the .ipa
      script: |
        set -e
        xcode-project build-ipa \
          --project Lockout.xcodeproj \
          --scheme Lockout \
          --config "$LOCKOUT_CONFIG"

    - &check_ipa
      name: Prove the .ipa is safe to install
      script: bash scripts/check-ipa.sh

  environment:
    ios: &ios_environment
      groups:
        # CERTIFICATE_PRIVATE_KEY, exactly as in 100 Daily Games. The group
        # lives in this app's Codemagic settings and must be added once.
        - appstore_credentials
      xcode: latest

workflows:
  # =====================================================================
  # Every push to main: unit tests + an unsigned compile. Ships nothing.
  # =====================================================================
  lockout-check:
    name: Lockout check (tests + compile)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    scripts:
      - *derive_version
      - *unit_tests
      - *generate_project
      - name: Compile all three targets (no signing)
        script: |
          set -e
          xcodebuild build \
            -project Lockout.xcodeproj \
            -scheme Lockout \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          # Prove all three targets were really built.
          APP=build/dd/Build/Products/Release-iphoneos/Lockout.app
          ls "$APP/Lockout" "$APP/PlugIns/LockoutMonitor.appex/LockoutMonitor" "$APP/PlugIns/LockoutShield.appex/LockoutShield"
          echo "OK: app + 2 extensions compiled"

  # =====================================================================
  # Development-signed build for Matteo's iPhone. `npm run ship`.
  # =====================================================================
  lockout-dev:
    name: Lockout (development build for iPhone)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: TDG App Store Key
    environment: *ios_environment
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-dev-*'
          include: true
        - pattern: 'ios-debug-*'
          include: true
    scripts:
      - *derive_version
      - *unit_tests
      - *generate_project
      - *dev_signing
      - *build_ipa
      - *check_ipa
    artifacts:
      - build/ios/ipa/*.ipa

  # =====================================================================
  # TestFlight. Do not push an ios-beta-* tag until Apple has approved
  # Family Controls (Distribution) for all three bundle ids; before that,
  # App Store signing fails with "Profile doesn't support Family Controls".
  # Also needs the app created in App Store Connect first.
  # =====================================================================
  lockout-testflight:
    name: Lockout (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: TDG App Store Key
    environment: *ios_environment
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-beta-*'
          include: true
    scripts:
      - *derive_version
      - *unit_tests
      - *generate_project
      - name: Create and apply App Store signing files (3 bundle ids)
        script: |
          set -e
          keychain initialize
          for id in fun.thedailygame.lockout fun.thedailygame.lockout.monitor fun.thedailygame.lockout.shield; do
            app-store-connect fetch-signing-files "$id" \
              --type IOS_APP_STORE \
              --platform IOS \
              --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
              --create
          done
          keychain add-certificates
          xcode-project use-profiles
      - *build_ipa
      - *check_ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        # Upload only, for an internal TestFlight group, like 100 Daily Games.
        auth: integration
